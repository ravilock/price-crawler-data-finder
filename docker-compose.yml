name: ${COMPOSE_PROJECT_NAME:-price-data-finder-local}
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-price}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}
    ports:
    - 127.0.0.1:${RABBITMQ_PORT:-19172}:5672
    - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-19173}:15672
    volumes:
    - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  crawler-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local PostgreSQL password}
    ports:
    - 127.0.0.1:${CRAWLER_POSTGRES_PORT:-19133}:5432
    volumes:
    - crawler-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT 1"
        | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    profiles: &id001
    - collection
  crawler:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/price-crawler-crawler:${CRAWLER_IMAGE_TAG-31c8ff5c57be3921c41b9d7662b498623199861c}
    environment:
      HTTP_ADDR: :8081
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-price}:${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}@rabbitmq:5672/
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-120}
      DATABASE_URL: postgres://crawler:${POSTGRES_PASSWORD:?Set local PostgreSQL password}@crawler-db:5432/crawler?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      crawler-db:
        condition: service_healthy
    profiles: *id001
  app:
    build:
      context: .
    environment:
      HTTP_ADDR: ${HTTP_ADDR-:8080}
      RABBITMQ_URL: ${RABBITMQ_URL-amqp://${RABBITMQ_DEFAULT_USER:-price}:${RABBITMQ_DEFAULT_PASS:?Set local RabbitMQ password}@rabbitmq:5672/}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-120}
      RECONNECT_INITIAL_DELAY_SECONDS: ${RECONNECT_INITIAL_DELAY_SECONDS:-1}
      RECONNECT_MAX_DELAY_SECONDS: ${RECONNECT_MAX_DELAY_SECONDS:-30}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${HTTP_ADDR##*:}/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
    - 127.0.0.1:${APP_PORT:-19180}:8080
    profiles:
    - app
volumes:
  rabbit-data: {}
  crawler-data: {}
